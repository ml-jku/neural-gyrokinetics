# model and dataset sections of the release config of ml-jku/gyroswin_large
# (huggingface pytorch_model.bin); build with neugk_jax.models.build.build_release_gyroswin
model:
  name: gyroswin_multi
  bundle_seq_length: 1
  latent_dim: 1024
  num_layers: 1
  decouple_mu: true
  conditioning:
  - timestep
  - itg
  - dg
  - s_hat
  - q
  extra_zf_loss: false
  loss_scheduler:
    df:
      type: linear
      start: 0
      end: 0
      start_fraction: 0
      end_fraction: 1.0
    phi:
      type: linear
      start: 0
      end: 0
      start_fraction: 0.5
      end_fraction: 0.7
    flux: null
    fluxavg:
      type: linear
      start: 1
      end: 1
      start_fraction: 0.0
      end_fraction: 1.0
    phi_int: null
    flux_int: null
    phi_cross: null
    flux_cross: null
  loss_weights:
    df: 1.0
    phi: 0.1
    flux: 0.0
    fluxavg: 0.0
  extra_loss_weights:
    phi_int: 0.0
    flux_int: 0.0
    phi_cross: 0.0
    flux_cross: 0.0
  swin:
    patch_size:
    - 4
    - 2
    - 4
    - 5
    - 4
    phi_patch_size:
    - 5
    - 4
    - 4
    window_size:
    - 4
    - 2
    - 2
    - 9
    - 4
    phi_window_size:
    - 9
    - 2
    - 4
    num_heads: 64
    depth: 4
    gradient_checkpoint: false
    merging_hidden_ratio: 4.0
    unmerging_hidden_ratio: 8.0
    c_multiplier: 2
    norm_output: false
    use_abs_pe: false
    act_fn: GELU
    patch_skip: true
    modulation: film
    drop_path: 0.1
    swin_bottleneck: true
    latent_cross_attn: true
    use_rpb: true
    use_rope: false
    detach_flux_latents: false
    flux_reduce: max
    flux_num_heads: 8
    flux_depth: 1
    init_weights: kaiming_uniform
    patching_init_weights: kaiming_uniform
    cond_init_weights: normal_smallvar
    flux_layernorms: false
    flux_conditioning: true
dataset:
  normalization: zscore
  normalization_scope: dataset
  offset: 80
  spatial_ifft: true
  separate_zf: true
  real_potens: true
  input_fields:
  - df

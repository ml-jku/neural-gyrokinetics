name: cyclone
path: /local00/bioinf/galletti/preprocessed_kvikio
backend: gds
gds_override: false
normalization: 
  df: 
    type: zscore
    agg_axes: [0, 1, 3, 4, 5]
  flux: 
    type: zscore
    agg_axes: null
  phi: 
    type: zscore
    agg_axes: [0, 1, 2]
normalization_scope: dataset
minmax_beta1: 8
minmax_beta2: 4
subsample: 1
val_subsample: 5
spatial_ifft: true
separate_zf: true
norm_decouple_mu: true
real_potens: true
split_into_bands: null
log_transform: false
num_workers: 10
active_keys: ["re", "im"]
input_fields: ["df"]
training_trajectories: "iteration_{0-7,9-12,14-64,67-99,101-114,116-130,132-147,149-199,201-234,236-261,263-299}.h5"
# validation_trajectories: ["iteration_13.h5", "iteration_100.h5", "iteration_200.h5"]
# validation_trajectories: "ood_iteration_{0-4}.h5"
validation_trajectories: [
  "iteration_8.h5",
  "iteration_115.h5",
  "iteration_131.h5",
  "iteration_148.h5",
  "iteration_235.h5",
  "iteration_262.h5",
  # "ood_iteration_0.h5",
  # "ood_iteration_1.h5",
  # "ood_iteration_2.h5",
  # "ood_iteration_3.h5",
  # "ood_iteration_4.h5",
]
partial_holdouts:
training_cond_filters:
  last_fluxes: [1., .inf]
  first_fluxes: [1., .inf]
eval_cond_filters:
  last_fluxes: [1., .inf]
  first_fluxes: [1., .inf]

augment:
  noise: 
    active: false
    noise_std: 1e-4
  mask_modes:
    active: false
    mask_ratio: 0.1
    is_fourier: false
    weights: null
    rescale: false
    mask_zero_mode: true
    df_delta_weight: 1.0

offset: 80
timestep_std_filter: null  # std-based timestep filtering threshold (null to disable)
timestep_std_offset: 80

# diffusion-specific:
latent_sampling_mode: stochastic  # stochastic, deterministic (used for diffusion with VAE latents)
val_latent_sampling_mode: deterministic  # separate sampling mode for validation (null to use same as training)
# pinc_revival dataset of the 20260606 two-stage runs; the other 60 of iteration_{0-299} are held out
name: cyclone
# preprocessed dataset root (required): export NEUGK_DATA or pass dataset.path=...
path: ${oc.env:NEUGK_DATA}
training_trajectories: "iteration_{1-2,4-7,9-19,21-35,37-40,42-47,49,51-54,56-64,66-72,74-78,80-84,86-93,95-99,101-103,105-107,109-112,114-116,118-120,122-124,126-129,131-133,135-137,139-141,143-145,147-149,152-154,156-158,160-162,164-167,169-171,173-175,177-179,181-184,186-188,190-192,194-196,198-201,203-205,207-209,211-213,215-217,219-222,224,226,228-230,232-234,236-239,241-243,245-247,249-251,253-256,258-260,262-264,266-268,270-273,275-277,279-281,283-285,287-289,292-294,296-298}"
validation_trajectories: ['iteration_3', 'iteration_50', 'iteration_150', 'iteration_225', 'iteration_290']
separate_zf: true
offset: 80
val_subsample: 10
normalization:
  df:
    type: zscore
    agg_axes: [1, 3, 4, 5]
# raw zf-separated df stats (4, 32, 8, 16, 85, 32) of the training set the base ae was trained on
normalization_stats: ${dataset.path}/diff_df_flux_phi_offset80_mu_d0253e25_stats.pkl
training_cond_filters:
  last_flux: [1., .inf]
  first_flux: [1., .inf]
eval_cond_filters:
  last_flux: [1., .inf]
  first_flux: [1., .inf]

# preprocessed dataset root (required): export NEUGK_DATA or pass dataset.path=...
path: ${oc.env:NEUGK_DATA}
backend: kvikio  # gpu-direct reads via cupy+kvikio, zero-copy to jax; falls back to numpy
# train-only wire dtype (null/fp32, fp16, bf16, i8, i4); shards from ``python -m neugk_jax.dataset.preprocess --mode=quantize``
prefer_dtype: null
training_trajectories: iteration_{0-3}
validation_trajectories: iteration_{4-4}
input_fields: [df]
conditions: [itg, dg, s_hat, q]
separate_zf: true
offset: 80
norm_decouple_mu: true
normalization:
  df:
    type: zscore
    agg_axes: [0, 1, 3, 4, 5]
  phi:
    type: zscore
    agg_axes: [0, 1, 2]
normalization_scope: dataset
# stats of the ae_noCond training set (offset 80, decoupled mu)
normalization_stats: ${dataset.path}/diff_df_flux_phi_offset80_mu_57f5caf2_stats.pkl
# lightweight_metadata defaults on when normalization_stats is set
# drop stable/non-turbulent runs (mean flux below 1.0 over the first/last 80 steps); null disables
training_cond_filters:
  last_flux: [1., .inf]
  first_flux: [1., .inf]
eval_cond_filters:
  last_flux: [1., .inf]
  first_flux: [1., .inf]

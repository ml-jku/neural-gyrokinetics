# PINC dataset config: three-way split (train/val/test); train: 235 trajs (300 - 5 val - 60 test); val: 5 trajs for model selection; test: 60 held-out turbulent trajs for final eval (~1080 snapshots, 10x downsample); val trajs (3, 50, 150, 225, 290) removed from training brace-expansion; test trajs disjoint, used by pinc.eval scripts; reference AEs/NFs: https://huggingface.co/datasets/gerkone/pinc_gkw
name: cyclone
path: /local00/bioinf/galletti/preprocessed_kvikio
backend: gds
gds_override: false
# training serves uniform bf16 (fast bf16 shards if converted, f32 downcast otherwise); validation always f32; null -> f32 everywhere
prefer_dtype: bf16
normalization: 
  df: 
    type: zscore
    agg_axes: [1, 3, 4, 5]
  flux: 
    type: zscore
    agg_axes: null
  phi: 
    type: zscore
    agg_axes: [0, 1, 2]
normalization_scope: dataset
minmax_beta1: 8
minmax_beta2: 4
subsample: 1
val_subsample: 10   # 10x temporal downsample for the validation & test sets
spatial_ifft: true
separate_zf: true
norm_decouple_mu: true
real_potens: true
split_into_bands: null
log_transform: false
num_workers: 10
active_keys: ["re", "im"]
input_fields: ["df"]
training_trajectories: "iteration_{1-2,4-7,9-19,21-35,37-40,42-47,49,51-54,56-64,66-72,74-78,80-84,86-93,95-99,101-103,105-107,109-112,114-116,118-120,122-124,126-129,131-133,135-137,139-141,143-145,147-149,152-154,156-158,160-162,164-167,169-171,173-175,177-179,181-184,186-188,190-192,194-196,198-201,203-205,207-209,211-213,215-217,219-222,224,226,228-230,232-234,236-239,241-243,245-247,249-251,253-256,258-260,262-264,266-268,270-273,275-277,279-281,283-285,287-289,292-294,296-298}.h5"
validation_trajectories: [  # 5 trajectories for model selection / hyperparameter tuning
  "iteration_3.h5", "iteration_50.h5", "iteration_150.h5", "iteration_225.h5", "iteration_290.h5",
]
# The 60 below are the held-out TEST set — disjoint from both train and val, used only for final eval.
# These are loaded by the pinc.eval runner (NOT during training).
test_trajectories: [  # turbulent-only test set, ~1080 snapshots, held out
  "iteration_0.h5", "iteration_8.h5", "iteration_20.h5", "iteration_36.h5", "iteration_41.h5",
  "iteration_48.h5", "iteration_55.h5", "iteration_65.h5", "iteration_73.h5", "iteration_79.h5",
  "iteration_85.h5", "iteration_94.h5", "iteration_100.h5", "iteration_104.h5", "iteration_108.h5",
  "iteration_113.h5", "iteration_117.h5", "iteration_121.h5", "iteration_125.h5", "iteration_130.h5",
  "iteration_134.h5", "iteration_138.h5", "iteration_142.h5", "iteration_146.h5", "iteration_151.h5",
  "iteration_155.h5", "iteration_159.h5", "iteration_163.h5", "iteration_168.h5", "iteration_172.h5",
  "iteration_176.h5", "iteration_180.h5", "iteration_185.h5", "iteration_189.h5", "iteration_193.h5",
  "iteration_197.h5", "iteration_202.h5", "iteration_206.h5", "iteration_210.h5", "iteration_214.h5",
  "iteration_218.h5", "iteration_223.h5", "iteration_227.h5", "iteration_231.h5", "iteration_235.h5",
  "iteration_240.h5", "iteration_244.h5", "iteration_248.h5", "iteration_252.h5", "iteration_257.h5",
  "iteration_261.h5", "iteration_265.h5", "iteration_269.h5", "iteration_274.h5", "iteration_278.h5",
  "iteration_282.h5", "iteration_286.h5", "iteration_291.h5", "iteration_295.h5", "iteration_299.h5",
]
partial_holdouts:
training_cond_filters:
  last_flux: [1., .inf]
  first_flux: [1., .inf]
eval_cond_filters:
  last_flux: [1., .inf]
  first_flux: [1., .inf]

augment:
  noise: 
    active: false
    noise_std: 1e-4
  mask_modes:
    active: false
    mask_ratio: 0.1
    is_fourier: false
    weights: null
    rescale: false
    mask_zero_mode: true
    df_delta_weight: 1.0
  vicreg_variance:
    active: false
    weight: 1.0
  logdet:
    active: false
    weight: 1.0

offset: 80
timestep_std_filter: null  # std-based timestep filtering threshold (null to disable)
timestep_std_offset: 80

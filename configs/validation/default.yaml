validate_every_n_epochs: 1
batch_size: null           # per device; null uses training.batch_size
n_eval_steps: 2            # gyroswin: autoregressive rollout steps (logs df_x1, df_x2, ...)
eval_integrals: true       # flux integrals of the denormalized prediction (phi_int_*, flux_int_*)
eval_spectra: false        # zonal-flow and ky/Q spectral metrics (needs gyaradax + metadata 'ds')
eval_sampling: false       # diffusion: sample, decode and integrate (slow)
eval_sample_steps: 50      # diffusion: euler steps per sample
eval_n_samples: 1          # diffusion: samples per validation condition
eval_max_batches: null     # diffusion: cap on sampling batches
eval_stride: 1             # diffusion: evaluate every k-th validation sample

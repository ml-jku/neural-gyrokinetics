batch_size: 1
n_epochs: 1
learning_rate: 3.0e-4
final_learning_rate: 1.0e-6
weight_decay: 1.0e-6
clip_grad: true
clip_to: 1.0
exclude_from_wd: [cond, pos_embed]
# mixed precision — when true, training reads bf16 shards (falls back to fp32+on-the-fly
# quantize when the bf16 sibling is missing). validation always reads fp32 and the eval
# pipeline (including flux integrals) stays in fp32. set ``dtype`` to the wire format.
amp:
  enable: false
  dtype: bf16

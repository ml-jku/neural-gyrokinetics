diffusion_checkpoint_dir: /projects/u6eb/outputs/20260408_213033_442
model_snapshot: best.pth

# data_path: if set, overrides the checkpoint config dataset.path for both
# training (latent-scale computation) and generation targets
# if null, the checkpoint config path is used
data_path: null

inference:
  device: cuda
  seed: 0
  # override latent_scale directly (useful when training data is on a different
  # machine and cannot be accessed)
  latent_scale: null

generation:
  trajectories:
    - iteration_8.h5
    - iteration_115.h5
    - iteration_135.h5
    - iteration_148.h5
    - iteration_232.h5
    - iteration_262.h5

  output_dir: /projects/u6eb/outputs/generated_samples
  output_prefix: generated
  n_samples: 256
  chunk_size: 64

  # ODE / denoising steps:
  #   flow - Euler integration steps
  #   edm  - Heun solver steps
  #   ddpm - denoising steps
  steps: 50

  calculate_mse_metrics: true

# required: diffusion run directory (config.yaml + model_snapshot)
diffusion_checkpoint_dir: ???
model_snapshot: best.pth
# autoencoder run directory, overrides ae_checkpoint of the diffusion config
ae_checkpoint: null

# data_path: if set, overrides the checkpoint config dataset.path for both
# training (latent-scale computation) and generation targets
data_path: null
# dataset normalization stats; with inference.latent_scale, no training data is needed
normalization_file: null

inference:
  device: cuda
  seed: 0
  # latent_scale used in training (1 / std of the training latents)
  latent_scale: null

generation:
  trajectories:
    - iteration_8.h5
    - iteration_115.h5
    - iteration_131.h5
    - iteration_148.h5
    - iteration_235.h5
    - iteration_262.h5

  output_dir: outputs/generated_samples
  output_prefix: generated
  n_samples: 128
  chunk_size: 64

  # ODE / denoising steps:
  #   flow - Euler integration steps
  #   edm  - Heun solver steps
  #   ddpm - denoising steps
  steps: 15

  calculate_mse_metrics: true

diffusion_checkpoint_dir: /system/user/publicwork/galletti/checkpoints/20260318_101659_466
ae_checkpoint: /system/user/publicwork/galletti/checkpoints/20260307_103002_984
model_snapshot: ckp.pth

# optional overrides. If null, values from diffusion checkpoint config are used
# unless the specific overrides below are set
data_path: null

# Path used for trainset normalization/latent-scale/cached stats discovery
stats_data_path: null

# Path used to read trajectories/metadata for generation targets
generation_data_path: /restricteddata/ukaea/gyrokinetics/preprocessed_kvikio/

backend: gds

# If null, the script will try to auto-discover matching files in data_path
cache:
  norm_stats_path: null
  latent_pkl_path: null

inference:
  device: cuda
  seed: 0
  # If null, script computes latent scale from training trajectories
  latent_scale: null

latent_stats:
  batch_size: 128
  num_workers: 0

generation:
  # trajectories: "iteration_{0-5,7-12,14-31,33-64,67-82,84-99}.h5"
  # trajectories: "ood_iteration_{0-4}.h5"
  trajectories:
    - iteration_8.h5
    - iteration_115.h5
    - iteration_131.h5
    - iteration_148.h5
    - iteration_235.h5
    - iteration_262.h5
    - ood_iteration_0.h5
    - ood_iteration_1.h5
    - ood_iteration_2.h5
    - ood_iteration_3.h5
    - ood_iteration_4.h5

  # optional direct condition vectors instead of trajectories
  # keys must match model.conditioning in the diffusion config!
  conditions: []
  # conditions:
  #   - name: custom_case_0
  #     itg: 3.0
  #     dg: 3.0
  #     s_hat: 0.8
  #     q: 1.4

  # optional geometry source trajectory for condition-only generation
  # filename relative to data_path, e.g. "iteration_8.h5"
  geometry_template: null

  output_dir: /restricteddata/ukaea/gyrokinetics/dumps/generate_samples3
  output_prefix: generated
  n_samples: 256
  chunk_size: 64

  # override for inference steps
  # - ddpm: denoising steps
  # - flow: ODE Euler steps
  # - edm: solver steps
  # - jit: refinement steps
  steps: 50

  # keep model output in normalized space
  save_normalized: false

  # metric computation using trajectory metadata
  calculate_mse_metrics: true
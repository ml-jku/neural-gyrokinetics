name: gyroswin_multi
bundle_seq_length: 1
latent_dim: 1024
num_layers: 1
decouple_mu: true
conditioning: ["itg", "dg", "s_hat", "q"]
loss_weights:
  df: 1.0
  phi: 0.1
loss_scheduler:
  df: null
  phi:
    type: linear
    start: 0
    end: 1
    start_fraction: 0.5
    end_fraction: 0.7

swin:
  patch_size: [4, 2, 4, 5, 4]
  phi_patch_size: [5, 4, 4]
  window_size: [4, 2, 2, 9, 4]
  phi_window_size: [9, 2, 4]
  num_heads: 32
  depth: 4
  merging_hidden_ratio: 4.0
  unmerging_hidden_ratio: 8.0
  c_multiplier: 2
  use_abs_pe: false
  act_fn: GELU
  patch_skip: true
  modulation: dit
  drop_path: 0.1
  swin_bottleneck: true
  latent_cross_attn: true
  use_rpb: true
  qk_norm: true
  gated_attention: true
  flux_reduce: max
  flux_num_heads: 8
  flux_depth: 1
  flux_conditioning: false
  norm_fn: RMSNorm

defaults:
  - _self_
  - dataset: cyclone
  - model: multi
  - logging: no_logging
  - training: default
  - validation: default
  - optional experiment: null

experiment_id: test
seed: 0
output_path: outputs 
ddp:
  enable: false
  n_nodes: 1
  debug: false
deepspeed:
  enable: false
  zero_stage: 2              # 1 or 2
  offload_optimizer: true    # offload Adam states to CPU (effective on GH200 NVLink-C2C)
  offload_param: false       # offload params to CPU (only for stage 3, not implemented)
  offload_activations: false # offload activations to CPU during forward pass
  allgather_bucket_size: 5e8
  reduce_bucket_size: 5e8
amp: 
  enable: true  # set to false when using rope or integrals in training (complex / fft)
  bfloat: true  # set to false for fno
mode: "train"
eval: true
device: "cuda"
load_ckpt: false
workflow: "pinc" # "gyroswin", "pinc", "diffusion"
stage: null  # training style, eg. "autoencoder", "peft"
ae_checkpoint: null

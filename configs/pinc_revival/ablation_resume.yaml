# PINC component-contribution ablation -- RESUME of the 6 intermediate combos only.
# The two endpoints already exist as trained fields and are NOT retrained here:
#   none = {df}            -> nf_ckps_revival/best_mlp_*       (density base)
#   all  = {df,int,diag,mono} -> nf_ckps_revival/best_int_mlp_* (full PINC)
# This sweep covers the 6 leave-some-in subsets, warm-started (pinc phase only) from
# the density base via pinc_init_from. checkpoints dumped per-combo to publicwork.
#
# combo subdir mapping (grid_worker saves to combo{job_id}):
#   combo0 {int}        combo1 {diag}       combo2 {mono}
#   combo3 {int,diag}   combo4 {int,mono}   combo5 {diag,mono}
#
# Run on gorilla:
#   python -m neugk.pinc.nf_main config=configs/pinc_revival/ablation_resume.yaml \
#     +save_ckpts=true gpus='[0,1,2,3,4,5]' throttling=1
mode: grid
# nf_main uses plain OmegaConf.from_cli (not hydra), so a `+save_ckpts=true` flag becomes
# a literal key "+save_ckpts" and never sets save_ckpts -> set it here in-config instead.
save_ckpts: true
ckp_path: /system/user/publicwork/galletti/pinc_revival/nf_ckps_ablation
# warm-start each (traj, timestep) from the pretrained density-only base NF (best_mlp_*),
# skipping the density phase. base NFs cover all 60 trajs x timesteps 90..260 at x1167.
pinc_init_from: /system/user/galletti/git/neural-gyrokinetics-gitlab/nf_ckps_revival

path: /local00/bioinf/galletti/preprocessed_kvikio
backend: gds
normalization: zscore
norm_axes: [-4]
use_flux_fields: false

epochs: 20
lr: 7e-3
batch_size: 4096
density_eval_every: 0
pinc_epochs: 100
pinc_lr: 5e-4
pinc_lr_sched: true
min_lr: 1e-8
pinc_eval_every: 2

# best PINC-paper neural field
name: mlp
dim: 64
n_layers: 5
skips: true
embed_type: discrete
act_fn: silu

gpus: [1, 2, 3, 4, 5, 6]
throttling: 1

# same coverage as the rest of the ablation: 60 test trajectories, 4 snapshots each.
timesteps: [110, 160, 210, 260]
trajectory: [
  iteration_0.h5, iteration_8.h5, iteration_20.h5, iteration_36.h5, iteration_41.h5,
  iteration_48.h5, iteration_55.h5, iteration_65.h5, iteration_73.h5, iteration_79.h5,
  iteration_85.h5, iteration_94.h5, iteration_100.h5, iteration_104.h5, iteration_108.h5,
  iteration_113.h5, iteration_117.h5, iteration_121.h5, iteration_125.h5, iteration_130.h5,
  iteration_134.h5, iteration_138.h5, iteration_142.h5, iteration_146.h5, iteration_151.h5,
  iteration_155.h5, iteration_159.h5, iteration_163.h5, iteration_168.h5, iteration_172.h5,
  iteration_176.h5, iteration_180.h5, iteration_185.h5, iteration_189.h5, iteration_193.h5,
  iteration_197.h5, iteration_202.h5, iteration_206.h5, iteration_210.h5, iteration_214.h5,
  iteration_218.h5, iteration_223.h5, iteration_227.h5, iteration_231.h5, iteration_235.h5,
  iteration_240.h5, iteration_244.h5, iteration_248.h5, iteration_252.h5, iteration_257.h5,
  iteration_261.h5, iteration_265.h5, iteration_269.h5, iteration_274.h5, iteration_278.h5,
  iteration_282.h5, iteration_286.h5, iteration_291.h5, iteration_295.h5, iteration_299.h5,
]

# grid axis: the 6 intermediate subsets of {int, diag, mono} on the df anchor.
# endpoints ({df} and {df,int,diag,mono}) are skipped -- already trained (see header).
physical_losses: [
  [df, int],
  [df, diag],
  [df, mono],
  [df, int, diag],
  [df, int, mono],
  [df, diag, mono],
]

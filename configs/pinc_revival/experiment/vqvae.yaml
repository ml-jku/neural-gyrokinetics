# @package _global_
# PINC revival: basic VQ-VAE (discrete latent, euclidean codebook). This is the
# "most basic" quantizer and the default for the main table.
# Run:  python main.py experiment=pinc_revival/vqvae
defaults:
  - override /dataset: pinc
  - override /model: pinc/vqvae
  - override /logging: no_logging
  - override /validation: default

experiment_id: pinc_revival_vqvae
workflow: pinc_autoencoder
seed: 0
mode: train
eval: true
device: cuda
load_ckpt: false

# euclidean codebook (the basic setup); flavor ablations override vq below
model:
  vq:
    codebook_type: euclidean

training:
  n_epochs: 400
  batch_size: 16
  learning_rate: 3e-4
  integral_loss_type: complex_mse
  eval_loss_type: mse

amp:
  enable: true
  bfloat: true

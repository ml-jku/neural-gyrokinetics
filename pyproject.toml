[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neugk-jax"
version = "0.0.1"
description = "JAX/Equinox port of neural gyrokinetics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.5.0",
    "ml-dtypes>=0.4",   # bf16 numpy dtype (quantize pipeline)
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "einops>=0.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.65",
    "wandb>=0.16",
    "pyyaml>=6.0",
    "matplotlib>=3.8",  # eval / parity figures
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
gyro = ["gyaradax @ git+https://github.com/gerkone/gyaradax.git@master"]
# neugk_jax.transport.gyroflow builds on BaseGKWGyaradaxPlugin, which upstream
# TORAX does not carry yet (google-deepmind/torax#2189)
transport = [
    "gyaradax @ git+https://github.com/gerkone/gyaradax.git@master",
    "torax @ git+https://github.com/gerkone/torax.git@qlgyx",
]
io = ["cupy-cuda12x", "kvikio-cu12"]
h5 = ["h5py>=3"]   # H5Backend (single-file .h5 trajectories)
dev = ["pytest>=7", "pytest-xdist", "ruff>=0.5", "h5py>=3", "huggingface_hub>=0.20"]

[tool.setuptools.packages.find]
include = ["neugk_jax*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/local", "tests/local"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E702", "E731"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.basedpyright]
# JAX / Equinox / NumPy are largely untyped, so basedpyright's default
# ("recommended") mode drowns the project in type-completeness noise that
# never catches a real bug here. Run in standard mode and explicitly silence
# the "unknown/any/missing-annotation" families plus the numpy<->jax Array
# interop and equinox-module false positives. Real-bug rules (possibly-unbound,
# unused, self/cls, etc.) stay on.
typeCheckingMode = "standard"
# untyped-3rd-party cascade (jax, equinox, numpy, torch have no/partial stubs)
reportMissingTypeStubs = false
reportMissingTypeArgument = false
reportMissingParameterType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportImplicitOverride = false
reportUnusedCallResult = false
reportDeprecated = false
# equinox eqx.Module fields are typed as `object`; calling them trips these
reportCallIssue = false
reportMissingSuperCall = false
# numpy NDArray <-> jax Array <-> ndarray annotations don't unify cleanly
reportArgumentType = false
reportAttributeAccessIssue = false
reportReturnType = false
reportOptionalMemberAccess = false
# gyaradax (optional dep) and neugk (sibling torch repo) aren't importable here
reportMissingImports = false
# runner/backend subclasses intentionally specialize return types; module-level
# __getattr__ lazy re-exports confuse the __all__ presence check
reportIncompatibleMethodOverride = false
reportUnsupportedDunderAll = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
